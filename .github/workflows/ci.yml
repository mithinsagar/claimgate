name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          python -m nltk.downloader -q punkt punkt_tab
      - name: Lint
        run: ruff check src scripts tests
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t claimgate .
      - name: Smoke test
        run: |
          docker run -d --name cg -p 8060:8060 claimgate
          for i in $(seq 1 30); do curl -fs localhost:8060/health && break; sleep 2; done
          curl -fs localhost:8060/health | grep -q '"ok"'
          curl -fs localhost:8060/ | grep -q ClaimGate
          docker rm -f cg

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          python -m nltk.downloader -q punkt punkt_tab
      - uses: actions/cache@v6
        with:
          path: |
            models
            ~/.cache/huggingface
          key: models-${{ hashFiles('scripts/fetch_models.py') }}-v1
      - name: Model weights
        run: python scripts/fetch_models.py hhem flan-t5-base embed
      - name: End-to-end test with real models
        env:
          CLAIMGATE_INTEGRATION: "1"
          CLAIMGATE_DEVICE: cpu
        run: pytest -q tests/test_integration.py
