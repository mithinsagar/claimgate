[project]
name = "claimgate"
version = "0.1.0"
description = "Claim-level verification of retrieval-augmented LLM answers: numbers, units and conditions checked before any learned judgement"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["claimgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
